{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <link rel="stylesheet" href = "{% static 'css/common.css' %}">
    <link rel="stylesheet" href = "{% static 'css/layout.css' %}">
    <link rel="stylesheet" href = "{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">

    <!-- Boxicons -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="templatemo-622-clearwave.css" />
</head>

<body class="auth-body">


  <!-- ============ NAV (TOP — unchanged structure) ============ -->
  <header class="site-header" id="siteHeader">
    <div class="container nav-inner">
      <a href="{% url 'index' %}" class="logo">
        <span class="logo-dot"></span>
        CareerGrowza
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="#features">Product</a>
        <a href="#how-it-works">How it works</a>
        <a href="#stories">Stories</a>
        <a href="{% url 'login' %}" class="nav-login">Log in</a>
        <a href="{% url 'register' %}" class="btn btn-primary btn-small">Sign Up</a>
      </nav>
    </div>
    <div class="nav-overlay" id="navOverlay"></div>
  </header>




    <div class="wrapper register-wrapper">

        <form method="POST" autocomplete="off">
                {% csrf_token %}

                {{user_form|crispy}}
                {{profile_form|crispy}}

                <button type="submit" class="btn btn-primary w-100 btn-block p-2">
                    Create account &nbsp; <i class="fa fa-user"></i>
                </button>
            </form>

    </div>

    <script src="js/reg.js"></script>

</body>

</html>
