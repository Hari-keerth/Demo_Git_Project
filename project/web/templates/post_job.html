<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post a New Job | Career Growza</title>
    <!-- Bootstrap CSS for styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f7f6;
      }
      .form-container {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        padding: 40px;
        margin-top: 50px;
        margin-bottom: 50px;
      }
      .btn-custom {
        background-color: #0d6efd;
        color: white;
        font-weight: 600;
        padding: 10px 25px;
        border-radius: 6px;
      }
      .btn-custom:hover {
        background-color: #0b5ed7;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
          <div class="form-container">
            <h2 class="text-center mb-4 font-weight-bold" style="color: #333">
              📢 Post a New Job Opportunity
            </h2>
            <p class="text-muted text-center mb-5">
              Fill in the details below to publish your open position to job
              seekers.
            </p>

            <form method="POST" action="{% url 'post_job' %}">
              {% csrf_token %}

              <!-- Job Title -->
              <div class="mb-3">
                <label for="title" class="form-label font-weight-bold"
                  >Job Title *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  placeholder="e.g. Senior Python Developer"
                  required
                />
              </div>

              <!-- Company Name -->
              <div class="mb-3">
                <label for="company" class="form-label">Company Name *</label>
                <input
                  type="text"
                  class="form-control"
                  id="company"
                  name="company"
                  placeholder="e.g. Growza Tech Solutions"
                  required
                />
              </div>

              <!-- Job Location -->
              <div class="mb-3">
                <label for="location" class="form-label">Location *</label>
                <input
                  type="text"
                  class="form-control"
                  id="location"
                  name="location"
                  placeholder="e.g. Kochi, Kerala (Hybrid)"
                  required
                />
              </div>

              <!-- Redirect URL (External Application) -->
              <div class="mb-3">
                <label for="redirect_url" class="form-label"
                  >External Application Link (Optional)</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="redirect_url"
                  name="redirect_url"
                  placeholder="https://company.com/apply"
                />
                <small class="text-muted"
                  >Direct applicants to your company careers page
                  instead.</small
                >
              </div>

              <!-- Required Skills (Comma separated) -->
              <div class="mb-3">
                <label for="required_skills" class="form-label"
                  >Required Skills *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="required_skills"
                  name="required_skills"
                  placeholder="e.g. Python, Django, PostgreSQL, Git"
                  required
                />
                <small class="text-muted">Separate skills with commas.</small>
              </div>

              <!-- Job Description -->
              <div class="mb-4">
                <label for="description" class="form-label"
                  >Detailed Job Description *</label
                >
                <textarea
                  class="form-control"
                  id="description"
                  name="description"
                  rows="6"
                  placeholder="Describe the responsibilities, requirements, and benefits of this position..."
                  required
                ></textarea>
              </div>

              <!-- Action Buttons -->
              <div
                class="d-flex justify-content-between align-items-center mt-4"
              >
                <a
                  href="{% url 'recruiter_dashboard' %}"
                  class="btn btn-outline-secondary"
                  >Back to Dashboard</a
                >
                <button type="submit" class="btn btn-custom">
                  Publish Job Post
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
