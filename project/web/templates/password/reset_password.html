{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CareerGrowza | Reset Password</title>

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="{% static 'images/favicon/CareerGrowza_Favicon.png' %}"
    />

    <link
      rel="shortcut icon"
      href="{% static 'images/favicon/favicon.ico' %}"
    />

    <link rel="stylesheet" href="{% static 'css/common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'css/password.css' %}" />
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
  </head>

  <body class="auth-body">
    <header class="site-header" id="siteHeader">
      <div class="container nav-inner">
        <a href="{% url 'index' %}" class="logo">
          <span class="logo-dot"></span>

          CareerGrowza
        </a>

        <button class="menu-toggle" id="menuToggle">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="nav-links" id="navLinks">
          <a href="#features">Product</a>
          <a href="#how-it-works">How it works</a>
          <a href="#stories">Stories</a>

          <a href="{% url 'login' %}" class="nav-login"> Log in </a>

          <a href="{% url 'register' %}" class="btn btn-primary btn-small">
            Sign Up
          </a>
        </nav>
      </div>
    </header>

    <div class="wrapper">
      <form method="POST" autocomplete="off">
        {% csrf_token %}

        <div class="login-header">
          <div class="login-icon">
            <i class="bx bx-lock-open"></i>
          </div>

          <h2>Create New Password</h2>

          <p class="subtitle">Choose a strong password for your account.</p>
        </div>

        {% if messages %} {% for message in messages %}

        <div class="message {{ message.tags }}">{{ message }}</div>

        {% endfor %} {% endif %}

        <div class="input-field create-password">
          <i class="bx bx-lock-alt input-icon"></i>

          <input
            type="password"
            name="password1"
            placeholder="New Password"
            required
          />

          <i class="bx bx-hide show-hide"></i>
        </div>

        <div class="input-field create-password">
          <i class="bx bx-lock-alt input-icon"></i>

          <input
            type="password"
            name="password2"
            placeholder="Confirm Password"
            required
          />

          <i class="bx bx-hide show-hide"></i>
        </div>

        <button type="submit">
          Reset Password

          <i class="bx bx-check-circle"></i>
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <div class="register">
          <p>
            <a href="{% url 'login' %}"> Back to Login </a>
          </p>
        </div>
      </form>
    </div>

    <script src="{% static 'js/index.js' %}"></script>

    <script>
      document.querySelectorAll('.show-hide').forEach(function (icon) {
        icon.addEventListener('click', function () {
          let input = this.previousElementSibling;

          if (input.type === 'password') {
            input.type = 'text';

            this.classList.replace('bx-hide', 'bx-show');
          } else {
            input.type = 'password';

            this.classList.replace('bx-show', 'bx-hide');
          }
        });
      });
    </script>
  </body>
</html>
