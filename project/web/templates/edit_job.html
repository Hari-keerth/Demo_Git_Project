<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Posting | Career Growza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .form-container { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); padding: 40px; margin-top: 50px; margin-bottom: 50px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="form-container">
                <h2 class="text-center mb-4 font-weight-bold" style="color: #333;">✏️ Edit Job Posting</h2>
                
                <form method="POST" action="{% url 'edit_job' job.id %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="title" class="form-label font-weight-bold">Job Title *</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ job.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="company" class="form-label">Company Name *</label>
                        <input type="text" class="form-control" id="company" name="company" value="{{ job.company }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location *</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ job.location }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="redirect_url" class="form-label">External Application Link (Optional)</label>
                        <input type="url" class="form-control" id="redirect_url" name="redirect_url" value="{{ job.redirect_url|default:'' }}">
                    </div>

                    <div class="mb-3">
                        <label for="required_skills" class="form-label">Required Skills *</label>
                        <input type="text" class="form-control" id="required_skills" name="required_skills" value="{{ skills_string }}" required>
                        <small class="text-muted">Separate skills with commas.</small>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Detailed Job Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="6" required>{{ job.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{% url 'recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
