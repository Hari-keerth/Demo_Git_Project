{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Posting | Career Growza</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/post_job.css' %}"> <!-- Uses the post job styling -->
</head>
<body style="background-color: #f3f4f6; padding: 40px 0;">

    <div style="max-width: 750px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 36px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        
        <!-- HEADER -->
        <div style="text-align: center; margin-bottom: 28px;">
            <h1 style="font-size: 28px; font-weight: 800; color: #1f2937; margin-bottom: 6px;">
                ✏️ Edit Job Posting
            </h1>
            <p style="color: #6b7280; font-size: 14px;">
                Update the job details below to keep candidates informed.
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- JOB TITLE -->
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Job Title *</label>
                <input type="text" name="title" value="{{ job.title }}" required placeholder="e.g. Senior Python Developer" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>

            <!-- COMPANY NAME -->
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Company Name *</label>
                <input type="text" name="company_name" value="{{ job.company_name|default:'' }}" required placeholder="e.g. Growza Tech Solutions" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>

            <!-- LOCATION -->
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Location *</label>
                <input type="text" name="location" value="{{ job.location }}" required placeholder="e.g. Kochi, Kerala (Hybrid)" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>

            <!-- TWO COLUMN GRID FOR SALARY & EXPERIENCE -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Salary Range (Optional)</label>
                    <input type="text" name="salary_range" value="{{ job.salary_range|default:'' }}" placeholder="e.g. ₹8,000,000 - ₹12,000,000 PA" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Experience Required (Optional)</label>
                    <input type="text" name="experience" value="{{ job.experience|default:'' }}" placeholder="e.g. 3-5 Years" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                </div>
            </div>

            <!-- EXTERNAL LINK -->
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">External Application Link (Optional)</label>
                <input type="url" name="external_link" value="{{ job.external_link|default:'' }}" placeholder="https://company.com/apply" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                <span style="font-size: 12px; color: #6b7280; display: block; margin-top: 4px;">Direct applicants to your company careers page instead.</span>
            </div>

            <!-- REQUIRED SKILLS -->
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Required Skills *</label>
                <input type="text" name="skills" value="{{ skills_string }}" required placeholder="e.g. Python, Django, PostgreSQL, Git" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                <span style="font-size: 12px; color: #6b7280; display: block; margin-top: 4px;">Separate skills with commas.</span>
            </div>

            <!-- DESCRIPTION -->
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #374151;">Detailed Job Description *</label>
                <textarea name="description" rows="5" required placeholder="Describe the responsibilities, requirements, and benefits of this position..." style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit;">{{ job.description }}</textarea>
            </div>

            <!-- FORM ACTIONS -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e5e7eb; padding-top: 20px;">
                <a href="{% url 'recruiter_dashboard' %}" style="padding: 10px 20px; border: 1px solid #d1d5db; background: #ffffff; color: #374151; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;">
                    Back to Dashboard
                </a>
                <button type="submit" style="padding: 10px 24px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;">
                    Save Changes
                </button>
            </div>

        </form>
    </div>

</body>
</html>
